<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — super_vibe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2315171C'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='34' font-weight='700' fill='%23fff' text-anchor='middle'%3Es%3C/text%3E%3Ccircle cx='47' cy='17' r='5' fill='%23FF7A45'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FAFAF8;--ink:#15171C;--muted:#6B6E76;--line:#E6E3DA;--accent:#2E3FE0;--accent-soft:#EBEDFB;--warm:#FF7A45;--ease:cubic-bezier(.16,1,.3,1);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;}
  a{color:inherit;text-decoration:none;}
  .logo{font-family:'Fraunces',serif;font-weight:700;font-size:20px;display:flex;align-items:center;gap:9px;padding:26px 32px;}
  .logo-dot{width:9px;height:9px;border-radius:50%;background:var(--warm);}
  main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;}
  .num{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(90px,18vw,180px);line-height:1;color:var(--ink);position:relative;}
  .num span{color:var(--accent);display:inline-block;animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
  h1{font-family:'Fraunces',serif;font-size:26px;margin:16px 0 10px;}
  p{color:var(--muted);font-size:16px;max-width:420px;margin:0 auto 30px;}
  .search{display:flex;max-width:380px;margin:0 auto 30px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px;}
  .search input{flex:1;border:none;padding:11px 16px;font-size:14px;background:transparent;}
  .search input:focus{outline:none;}
  .search button{background:var(--ink);color:#fff;border:none;border-radius:999px;padding:11px 20px;font-weight:600;font-size:13.5px;cursor:pointer;}
  .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .btn{display:inline-flex;padding:13px 24px;border-radius:999px;font-weight:600;font-size:14.5px;transition:.3s var(--ease);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{transform:translateY(-3px);}
  .btn-ghost{border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink);}
</style>
</head>
<body>
<a href="index.html" class="logo"><span class="logo-dot"></span>super_vibe</a>
<main>
  <div>
    <div class="num">4<span>0</span>4</div>
    <h1>This page took a day off</h1>
    <p>The page you're looking for doesn't exist, or it moved somewhere we haven't tracked yet.</p>
    <form class="search" onsubmit="event.preventDefault(); window.location.href='blog.html';">
      <input type="text" placeholder="Search the blog...">
      <button type="submit">Search</button>
    </form>
    <div class="actions">
      <a href="index.html" class="btn btn-primary">Back to home</a>
      <a href="contact.html" class="btn btn-ghost">Contact support</a>
    </div>
  </div>
</main>
<canvas id="eggCanvas"></canvas>
<p style="text-align:center;color:var(--muted);font-size:11.5px;padding-bottom:20px;">psst — watch the corner 👀</p>
<script>
  const canvas = document.getElementById('eggCanvas');
  canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1;';
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const colors = ['#2E3FE0','#FF7A45','#1E9E5A','#F5C842','#D93025'];
  let colorIdx = 0;
  const logo = { x: 60, y: 60, w: 90, h: 30, vx: 2.4, vy: 2.1 };
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = colors[colorIdx];
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    if(ctx.roundRect){ ctx.roundRect(logo.x, logo.y, logo.w, logo.h, 8); } else { ctx.rect(logo.x, logo.y, logo.w, logo.h); }
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff';
    ctx.font = '600 13px Inter, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('super_vibe', logo.x + logo.w/2, logo.y + logo.h/2 + 1);

    logo.x += logo.vx; logo.y += logo.vy;
    let bounced = false;
    if(logo.x <= 0 || logo.x + logo.w >= canvas.width){ logo.vx *= -1; bounced = true; }
    if(logo.y <= 0 || logo.y + logo.h >= canvas.height){ logo.vy *= -1; bounced = true; }
    if(bounced){ colorIdx = (colorIdx + 1) % colors.length; }
    requestAnimationFrame(draw);
  }
  draw();
</script></body>
</html>
